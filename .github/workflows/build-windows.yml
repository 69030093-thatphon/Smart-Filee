name: Build Smart File Manager Pro (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Rust native release executable
        run: cargo build --release -p smart_filee_app

      - name: Verify headless self-test
        run: target\release\smart_filee.exe --selftest

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe with Inno Setup
        shell: pwsh
        run: |
          iscc installer.iss

      - name: Upload Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileManagerPro-Setup
          path: Output/*.exe
          if-no-files-found: error

      - name: Upload Standalone Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileManagerPro-Portable
          path: target/release/smart_filee.exe

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} Output/*.exe target/release/smart_filee.exe --repo ${{ github.repository }} --clobber
