[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/localization",
    "crates/file_engine",
    "crates/organizer",
    "crates/search",
    "crates/renamer",
    "crates/duplicate",
    "crates/image_engine",
    "crates/disk_analyzer",
    "crates/cleanup",
    "crates/backup",
    "crates/system_monitor",
    "crates/network",
    "crates/app",
]

[workspace.package]
version = "4.3.1"
edition = "2021"
authors = ["Smart-Filee Team", "xmxmxxx <69030093@kmitl.ac.th>"]
license = "MIT"
repository = "https://github.com/69030093-thatphon/Smart-Filee.git"

[workspace.dependencies]
# Error handling & logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization & time
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Filesystem & Pattern matching
trash = "5.3"
walkdir = "2.5"
glob = "0.3"
filetime = "0.2"

# Hashing & Media
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
exif = { package = "kamadak-exif", version = "0.5" }

# CLI & Environment
dotenvy = "0.15"
sysinfo = "0.31"

# Internal crates
smart_filee_common = { path = "crates/common" }
smart_filee_localization = { path = "crates/localization" }
smart_filee_file_engine = { path = "crates/file_engine" }
smart_filee_organizer = { path = "crates/organizer" }
smart_filee_search = { path = "crates/search" }
smart_filee_renamer = { path = "crates/renamer" }
smart_filee_duplicate = { path = "crates/duplicate" }
smart_filee_image_engine = { path = "crates/image_engine" }
smart_filee_disk_analyzer = { path = "crates/disk_analyzer" }
smart_filee_cleanup = { path = "crates/cleanup" }
smart_filee_backup = { path = "crates/backup" }
smart_filee_system_monitor = { path = "crates/system_monitor" }
smart_filee_network = { path = "crates/network" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
field_reassign_with_default = "allow"
manual_string_new = "allow"
